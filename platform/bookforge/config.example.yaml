# Copy to config.yaml (gitignored) on the host. Every key is optional: values shown are the
# built-in defaults. A series may override any key in its own <series>/config.yaml.
# Starting points, not tested settings: tune on chapter 1 and the benchmarks.
data_dir: /opt/platform/data/bookforge

models:
  writer:
    base_url: http://127.0.0.1:8040/v1
    model: ""                          # id from `c/coli status`
    temperature: [0.7, 0.85, 1.0]      # one per draft
    manage_service: null
    timeout_seconds: 600               # seconds to wait for one reply
    isolate_requests: true             # unique first line per request: stops Ollama reusing state from the previous one
    extra_body: {}                     # extra request fields; for a reasoning model (Qwen3...) on Ollama use {reasoning_effort: none}
  critic:
    base_url: http://127.0.0.1:8041/v1
    model: ""                          # id from `c/coli status`
    temperature: 0.2
    manage_service: platform-colibri-critic   # start/stop per step to save RAM (not wired up yet)
    timeout_seconds: 1800              # the big model can take many minutes per reply
    isolate_requests: true
    extra_body: {}
  decide:
    url: http://127.0.0.1:8041/v1/systemone
  extra: {}                            # more named endpoints, same fields as writer/critic; a layer may use one: layers.<name>.model: <key>
  assign:
    research: writer                   # who reads pages and extracts facts (writer | critic | a key of extra)
    extraction: writer                 # who records what each accepted scene says about the tracked states

layers:                                # model used for the refine step; review is always the critic
  series_north_star: {model: critic, checkpoint: direction}
  book_north_star:   {model: critic, checkpoint: direction}
  synopsis:          {model: critic, checkpoint: direction}
  ledger:            {model: critic, checkpoint: ledger}      # the story-event ledger, extracted from the synopsis; you approve it before acts run
  acts:              {model: critic, checkpoint: structure}   # count: [3, 4] would force the number of acts; by default the story's events decide
  chapters:          {model: critic, checkpoint: structure}   # count: [25, 35] would force the chapter total; by default each act's weight of events decides
  scenes:            {model: critic, checkpoint: structure}   # per_chapter: [2, 4] would force scenes per chapter; by default 1 to 4 as the chapter needs
  prose:             {model: writer, drafts: 2, words: [1500, 3000]}   # retry_flagged: after (flagged scenes last) or inline (book order); max_tokens: 5100 would set the most one draft may use (default: the longest words x 1.6 + 300)

research:
  enabled: true
  required: false                      # true: a layer fails if none of its questions could be answered
  search: playwright_web_tool          # platform/tools/web_tool.py; no direct HTTP
  source: auto                         # auto | searxng | wikipedia | duckduckgo. auto: your SearXNG if it answers, else Wikipedia only
  searxng_url: http://127.0.0.1:8060   # local only (docs/STACK.md, SearXNG; scripts/setup-searxng.sh)
  search_language: en                  # language of the results SearXNG asks for ('all' for any)
  wikipedia_language: en               # which Wikipedia: en, de, fr, ...
  results_per_question: 10             # search results considered per question
  max_questions: 6                     # questions asked per layer
  pages_per_question: 5                # pages read per question, at most (a page with no readable text does not count)
  facts_per_question: 3                # stop reading pages for a question once this many facts are kept...
  sources_per_question: 2              # ...and they come from at least this many different pages
  check_support: true                  # drop a fact whose claim says more than its quote (one small call per page with facts)
  model_pick: true                     # the notes model chooses which results to read from titles and excerpts (one small call per question)
  skip_domains: [facebook.com, instagram.com, tiktok.com, pinterest.com, twitter.com, x.com, youtube.com, youtu.be, amazon.com, ebay.com, etsy.com, reddit.com, quora.com, jstor.org, researchgate.net, academia.edu, newspapers.com, ancestry.com, ancestry.co.uk, findagrave.com, rootsweb.com, sova.si.edu]
  notes_model: research                # which model reads pages and extracts facts: research (models.assign.research), writer, critic or a key of models.extra
  check_relevance: true                # drop facts that do not fit the question and the story's time and place
  notes_max_chars: 6000                # research notes included in a prompt
  page_max_chars: 12000                # page text given to the model (for a long page, the parts that mention the question)
  scene_questions: 2                   # questions researched per chapter before its scenes are planned (0 = none)

ledger:
  weight_per_chapter: 2.0              # story weight one chapter carries (events weigh 1 minor, 2 ordinary, 3 major)
  min_chapters: 12                     # less story than this many chapters' worth is 'thin': the ledger asks you questions instead of padding

book:
  target_words: 90000
  pov: third-limited
  tense: past
  language: English                    # section headings stay in English

briefing:
  max_tokens: 16000
  previous_scene_words: 250            # tail of the previous scene given verbatim: enough to continue the moment, too little to copy
  sample_passages: 2                   # style/samples/*.md files included
  recent_chapters_full: 2              # chapters before this one summarised scene by scene; older ones in a line each

qc:
  model: writer                        # writer | critic: which model answers the prose layer's checks (judge, continuity, critic); writer keeps one model loaded
  temperature: 0.2                     # those checks' temperature when they run on the writer model
  continuity_flag_threshold: 0.3
  critic_min_score: 3
  max_revision_rounds: 2
  banned_phrases: style/banned.txt
  critic_may_accept: within_chapter    # within_chapter | never; change requests reaching other chapters always wait for you
  dialogue_ratio: [0.05, 0.75]         # share of words inside quotes; outside it is a warning
  sentence_variation_min: 0.45         # stdev / mean of sentence length; below it the rhythm is flagged as monotone
  overused_word_percent: 1.0           # a content word above this share of the scene is flagged (names excluded)
  overused_word_min_count: 8
  repeat_ngram_size: 5                 # words in a phrase checked for repetition across scenes
  repeat_ngram_scenes: 2               # earlier scenes that must contain a phrase before it is flagged
  judge_drafts: true                   # choose between drafts with the pairwise judge (otherwise by mechanical score)
  continuity_check: true               # yes/no questions about the story state, the cast and the world
  revise_flagged: true                # a flagged scene is first revised from its saved text with what was found, then written again
  critic_rewrite: true                 # beats_covered or pacing below the minimum: write the scene again once with the critic's notes
  critic_check: true                   # the rubric critique
  extract_observed: true               # record what each accepted scene says about the tracked states
  review_structure: true               # critic review of acts, chapters and scene plans against their parents
  confirm_contradictions: true         # re-check each contradiction flag in a narrow second call
  continuity_batch_size: 8             # questions per model call
  continuity_max_questions: 40         # per scene

export:
  title: ""                            # falls back to the series folder's name
  subtitle: ""
  author: ""
  rights: ""
  pdf_engine: auto                     # auto | typst | xelatex | lualatex (auto: the first one installed)
  page_width_in: 6.0                   # print interior: 6 x 9 in
  page_height_in: 9.0
  margin_in: 0.8
  font_size_pt: 11
  reference_docx: ""                   # your own Word styles instead of the built-in manuscript format
  cover_image: ""                      # EPUB cover, a path inside the series

git:
  commit_each_step: true
  tag_checkpoints: true
