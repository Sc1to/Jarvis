acts:
- id: b2.act1
  title: Arrival and Alliance
  summary: Eli Vance arrives at Erebus-7 and observes the decaying industrial environment where his debt
    binds him to the Astra Dominion. He seeks out Mara Kovic, a technician suffering from radiation-induced
    cognitive decline, who reveals that Eli's grandfather was executed by the corporation for discovering
    mining destabilization. This revelation prompts Eli to seek the truth about the buried ship.
  purpose: To establish the setting, the protagonist's motivation, and the central conflict through the
    discovery of the past truth.
  turning_point: Mara reveals that Eli's grandfather was executed by the corporation for discovering mining
    destabilization.
