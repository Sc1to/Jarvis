- id: b2.act3
  title: Escape and Compromise
  summary: Mara intervenes to protect the data drive, outmaneuvering Halloway in the process, while Eli
    uploads the data triggering a lockdown and worsening her condition. Eli accepts he cannot save Mara
    as she succumbs to her condition, then launches the *Kestrel* to escape as Halloway seals the sector.
    The corporation allows Eli to escape only on the condition that he signs a non-disclosure agreement
    and debt contract.
  purpose: To resolve the immediate physical conflict, deliver the emotional climax of Mara's death, and
    establish the bittersweet reality of the protagonist's survival.
  turning_point: Eli launches the *Kestrel* and escapes as Halloway seals the sector.
