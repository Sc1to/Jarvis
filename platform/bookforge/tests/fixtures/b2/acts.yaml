- id: b2.act2
  title: The Hunt and the Ship
  summary: Eli and Mara form an alliance to navigate the mining tunnels while Foreman Halloway begins
    hunting them as liabilities. They locate the buried *Kestrel* beneath the processing plant but realize
    that activating it requires bypassing safety protocols that would expose corporate secrets. Halloway
    intercepts them at the launch bay with drones and a plasma cutter, forcing Eli to decide between fighting
    or broadcasting data.
  purpose: To escalate the conflict through the antagonist's pursuit and force the protagonist into a
    critical strategic choice regarding the ship's activation.
  turning_point: Eli decides to broadcast contamination data instead of fighting.
