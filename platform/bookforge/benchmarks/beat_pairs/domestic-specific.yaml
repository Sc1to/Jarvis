id: domestic-specific
purpose: A couple has breakfast and their relationship moves a little.
pov: Hana
setting: a small kitchen on a weekday morning
characters:
- name: Hana
  facts:
  - a nurse on night shifts; dry, affectionate
- name: Joel
  facts:
  - her husband, a teacher; talkative in the morning
situation: Hana has just finished a twelve-hour night shift. Joel has decided, without telling her, to ask the school to move him to a later start so he can be home with her in the evenings.
learns: Hana learns what Joel has done and lets herself be looked after for once.
beats:
- Hana comes in at seven. Joel has made eggs the way she likes them and has put the radio on low. She teases him that he has overdone the toast; he says it was on purpose.
- "Over breakfast Joel talks about his class, then stops mid-story and tells her he has asked for the later start. Hana is surprised, not angry: she asks what the head said. He says yes, from next term."
- Hana's first reaction is to protest that he does not have to rearrange his life for her shifts; Joel answers that he is not rearranging it for her shifts, he wants the evenings.
- Hana lets that stand. She asks him to sit down and finish the story about his class, and eats the toast.
words:
- 400
- 800
