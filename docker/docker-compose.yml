services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  # Profile "real" — real Ollama (requires GPU or large RAM)
  ollama:
    image: ollama/ollama:latest
    profiles: [real]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # GPU passthrough (remove deploy block if no GPU on dev machine)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Profile "mock" — lightweight mock, no GPU needed
  mock-ollama:
    build: ../scripts/dev/mock-ollama
    profiles: [mock]
    ports:
      - "11434:11434"
    environment:
      - MOCK_DELAY_MS=50
    networks:
      default:
        aliases:
          - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 5s
      timeout: 3s
      retries: 3

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8020:8000"
    volumes:
      - chroma-data:/chroma/chroma

  # ── Platform apps ─────────────────────────────────────────────────────────────

  admin:
    build:
      context: ../platform
      dockerfile: admin/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env.docker
    volumes:
      - platform-data:/opt/platform/data
    depends_on:
      - chromadb

  chat:
    build:
      context: ../platform
      dockerfile: chat/Dockerfile
    ports:
      - "8010:8010"
    env_file: .env.docker

  writer:
    build:
      context: ../platform
      dockerfile: writer/Dockerfile
    ports:
      - "8011:8011"
    env_file: .env.docker

  coding:
    build:
      context: ../platform
      dockerfile: coding/Dockerfile
    ports:
      - "8012:8012"
    env_file: .env.docker
    volumes:
      - platform-data:/opt/platform/data

  # ── Autocoder ─────────────────────────────────────────────────────────────────

  autocoder-dashboard:
    build:
      context: ../platform
      dockerfile: autocoder/dashboard/Dockerfile
    ports:
      - "8050:8050"
    env_file: .env.docker
    volumes:
      - platform-data:/opt/platform/data
    depends_on:
      - conductor

  conductor:
    build:
      context: ../platform
      dockerfile: autocoder/conductor/Dockerfile
    ports:
      - "8001:8001"
    env_file: .env.docker
    volumes:
      - platform-data:/opt/platform/data
      - projects-data:/opt/platform/data/projects
    environment:
      - DASHBOARD_URL=http://autocoder-dashboard:8050
    depends_on:
      - re-agent

  re-agent:
    build:
      context: ../platform
      dockerfile: autocoder/re-agent/Dockerfile
    ports:
      - "8002:8002"
    env_file: .env.docker
    volumes:
      - platform-data:/opt/platform/data

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile
      - ../frontend/admin/dist:/srv/admin:ro
      - ../frontend/chat/dist:/srv/chat:ro
      - ../frontend/writer/dist:/srv/writer:ro
      - ../frontend/coding/dist:/srv/coding:ro
      - ../frontend/autocoder/dist:/srv/autocoder:ro
    depends_on:
      - admin
      - chat
      - writer
      - coding
      - autocoder-dashboard
    restart: unless-stopped

volumes:
  ollama-data:
  chroma-data:
  platform-data:
  projects-data:

networks:
  default:
    name: platform-dev
